<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>СММ Про — Планер постов</title>
  <style>
    :root {
      --primary: #4a90e2;
      --bg: #f5f7fa;
      --card: #ffffff;
      --text: #333;
      --danger: #e55656;
    }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 8px;
    }
    .container {
      max-width: 600px;
      margin: auto;
    }
    header {
      text-align: center;
      padding: 16px 0;
    }
    h1 { margin: 0; font-size: 24px; }
    nav {
      display: flex;
      justify-content: space-around;
      margin-bottom: 12px;
    }
    .tab-btn {
      background: none;
      border: none;
      color: #888;
      font-size: 14px;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 20px;
    }
    .tab-btn.active {
      color: white;
      background: var(--primary);
    }
    .screen { display: none; }
    .screen.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 12px;
    }
    input, textarea, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
      margin-bottom: 8px;
      font-size: 15px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover { opacity: 0.9; }
    button.secondary {
      background: transparent;
      color: var(--primary);
      border: 1px solid var(--primary);
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-top: 8px;
    }
    .day-cell {
      background: #fff;
      border: 1px solid #eee;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      border-radius: 6px;
      position: relative;
      cursor: pointer;
    }
    .day-cell.today {
      background: #e3f2fd;
      font-weight: bold;
      border-color: var(--primary);
    }
    .day-cell.has-posts::after {
      content: "●";
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--danger);
      font-size: 10px;
    }
    .post-list { list-style: none; padding: 0; margin: 0; }
    .post-item {
      background: #f9f9f9;
      border-left: 4px solid var(--primary);
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .post-meta {
      color: #888;
      font-size: 12px;
      margin-top: 4px;
    }
    .chart-placeholder {
      height: 180px;
      background: #eef2f7;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      margin-bottom: 12px;
    }
    .stat-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .stat-box {
      background: #fff;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .stat-value { font-size: 20px; font-weight: bold; color: var(--primary); }
    .stat-label { font-size: 13px; color: #666; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>СММ Про</h1>
    </header>

    <nav>
      <button class="tab-btn active" data-screen="plan">План</button>
      <button class="tab-btn" data-screen="post">Пост</button>
      <button class="tab-btn" data-screen="stats">Аналитика</button>
    </nav>

    <!-- Экран: План -->
    <div id="plan" class="screen active">
      <div class="card">
        <h3>Календарь на месяц</h3>
        <div class="calendar-grid" id="calendar"></div>
      </div>
      <div class="card">
        <h3>Ближайшие посты</h3>
        <ul class="post-list" id="upcoming-posts"></ul>
      </div>
    </div>

    <!-- Экран: Создание поста -->
    <div id="post" class="screen">
      <div class="card">
        <h3>Создать пост</h3>
        <label>Соцсеть</label>
        <select id="network">
          <option value="vk">ВКонтакте</option>
          <option value="telegram">Telegram</option>
          <option value="max">MAX</option>
        </select>
        <label>Текст поста</label>
        <textarea id="post-text" placeholder="Напишите текст здесь..." rows="5"></textarea>
        <label>Хештеги</label>
        <input type="text" id="hashtags" placeholder="#маркетинг #соцсети">
        <label>Дата и время публикации</label>
        <input type="datetime-local" id="publish-time">
        <button onclick="savePost()">Запланировать</button>
        <p style="font-size:13px;color:#666">Или загрузите сразу список постов из CSV:</p>
        <input type="file" id="csv-file" accept=".csv">
        <button class="secondary" onclick="handleCSV()">Загрузить список из CSV</button>
      </div>
    </div>

    <!-- Экран: Аналитика -->
    <div id="stats" class="screen">
      <div class="card">
        <h3>Охваты и вовлечённость</h3>
        <div class="chart-placeholder">График охватов (интеграция с API)</div>
        <div class="stat-row">
          <div class="stat-box">
            <div class="stat-value" id="total-reach">0</div>
            <div class="stat-label">Охват</div>
          </div>
          <div class="stat-box">
            <div class="stat-value" id="total-engagement">0</div>
            <div class="stat-label">Вовлечённость</div>
          </div>
        </div>
      </div>
      <div class="card">
        <h3>Топ постов по охвату</h3>
        <ul class="post-list" id="top-posts"></ul>
      </div>
    </div>
  </div>

  <script>
    let posts = JSON.parse(localStorage.getItem('smmpro_posts')) || [];

    function savePosts() {
      localStorage.setItem('smmpro_posts', JSON.stringify(posts));
    }

    function renderCalendar() {
      const today = new Date();
      const month = today.getMonth();
      const year = today.getFullYear();
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      const calendarEl = document.getElementById('calendar');
      calendarEl.innerHTML = '';

      let dayIndex = 1;
      for (let w = 0; w < 6; w++) {
        for (let d = 0; d < 7; d++) {
          const cell = document.createElement('div');
          cell.className = 'day-cell';
          if (w === 0 && d < firstDay) {
            cell.textContent = '';
          } else if (dayIndex <= daysInMonth) {
            const dateObj = new Date(year, month, dayIndex);
            const isToday = dayIndex === today.getDate() && month === today.getMonth() && year === today.getFullYear();
            const hasPosts = posts.filter(p => {
              const pDate = new Date(p.publishTime);
              return pDate.getDate() === dayIndex && pDate.getMonth() === month && pDate.getFullYear() === year;
            }).length > 0;

            if (isToday) cell.classList.add('today');
            if (hasPosts) cell.classList.add('has-posts');

            cell.textContent = dayIndex;
            cell.onclick = () => showPostsForDay(dayIndex);

            dayIndex++;
          }
          calendarEl.appendChild(cell);
          if (dayIndex > daysInMonth) break;
        }
        if (dayIndex > daysInMonth) break;
      }
    }

    function showPostsForDay(day) {
      const today = new Date();
      const postsForDay = posts.filter(p => {
        const d = new Date(p.publishTime);
        return d.getDate() === day && d.getMonth() === today.getMonth() && d.getFullYear() === today.getFullYear();
      });
      const list = document.getElementById('upcoming-posts');
      list.innerHTML = '';
      if (postsForDay.length === 0) {
        list.innerHTML = '<li style="color:#999">Нет постов на этот день</li>';
        return;
      }
      postsForDay.forEach(p => {
        const li = document.createElement('li');
        li.className = 'post-item';
        li.innerHTML = `
          <strong>${p.network}</strong><br>
          ${p.text.substring(0, 80)}${p.text.length > 80 ? '...' : ''}
          <div class="post-meta">${new Date(p.publishTime).toLocaleTimeString()} • ${p.hashtags || ''}</div>
        `;
        list.appendChild(li);
      });
    }

    function savePost() {
      const network = document.getElementById('network').value;
      const text = document.getElementById('post-text').value.trim();
      const hashtags = document.getElementById('hashtags').value.trim();
      const publishTime = document.getElementById('publish-time').value;

      if (!text) {
        alert('Текст поста обязателен');
        return;
      }
      if (!publishTime) {
        alert('Укажите дату и время публикации');
        return;
      }

      posts.push({
        id: Date.now(),
        network,
        text,
        hashtags,
        publishTime
      });

      savePosts();
      renderCalendar();
      showPostsForDay(new Date(publishTime).getDate());
      alert('Пост сохранён в план!');
      document.getElementById('post-text').value = '';
      document.getElementById('hashtags').value = '';
    }

    // Обработка CSV
    function handleCSV() {
      const fileInput = document.getElementById('csv-file');
      const file = fileInput.files[0];
      if (!file) {
        alert('Выберите CSV-файл');
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        const csvText = e.target.result;
        const lines = csvText.split('\n');
        let imported = 0;
        // Пропускаем первую строку (заголовки)
        for (let i = 1; i < lines.length; i++) {
          const cols = lines[i].split(',');
          if (cols.length < 4) continue;
          const network = cols[0].trim();
          const text = cols[1].trim();
          const hashtags = cols[2].trim();
          const publishTime = cols[3].trim();

          if (!text || !publishTime) continue;

          posts.push({
            id: Date.now() + i,
            network,
            text,
            hashtags,
            publishTime
          });
          imported++;
        }
        savePosts();
        renderCalendar();
        alert(`Загружено ${imported} постов из CSV`);
        fileInput.value = ''; // сброс
      };
      reader.readAsText(file);
    }

    function renderStats() {
      const totalReach = posts.length * 120;
      const totalEngagement = posts.length * 35;
      document.getElementById('total-reach').textContent = totalReach.toLocaleString();
      document.getElementById('total-engagement').textContent = totalEngagement.toLocaleString();

      const topPostsList = document.getElementById('top-posts');
      topPostsList.innerHTML = '';
      const sorted = [...posts].sort((a, b) => new Date(b.publishTime) - new Date(a.publishTime)).slice(0, 3);
      sorted.forEach((p, i) => {
        const li = document.createElement('li');
        li.className = 'post-item';
        li.textContent = `${i + 1}. ${p.network} — ${p.text.substring(0, 60)}...`;
        topPostsList.appendChild(li);
      });
    }

    // Переключение вкладок
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

        const screenId = btn.getAttribute('data-screen');
        document.getElementById(screenId).classList.add('active');
        btn.classList.add('active');

        if (screenId === 'stats') renderStats();
      });
    });

    // Установка даты по умолчанию — сегодня + 1 час
    const defaultTime = new Date();
    defaultTime.setHours(defaultTime.getHours() + 1);
    document.getElementById('publish-time').value = defaultTime.toISOString().slice(0, 16);

    renderCalendar();
    renderStats();
  </script>
</body>
</html>
